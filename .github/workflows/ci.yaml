name: ci
on: [push]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.0
      - run: go work init ; go work use -r . ; go work sync ; go list -m all
      - run: go run ./01-hello-gopher
      - run: sudo apt-get install -yqq jq
      # test
      - run: go test -v `go work edit -json | jq -r '.Use[].DiskPath + "/..."'`
      # lint
      - run: cd ./12-efficient-memory-management-with-pointers-and-slices ; go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest ; cd ..
      - run: golangci-lint run `go work edit -json | jq -r '.Use[].DiskPath + "/..."'`
      # run
      - run: go run ./01-hello-gopher
      - run: go run ./02-hello-other
      - run: go run ./03-fail-fast-and-first-success-goroutines-channels
      - run: go run ./04-primitive-types
      - run: go run ./05-functions-methods-structs
      - run: go run ./06-goroutines-and-concurrency-model
      - run: go run ./07-concurrency-patterns
      - run: go run ./08-concurrent-task-management
      - run: go run ./09-error-handling-in-go
      - run: go run ./10-testing-in-go
      - run: go run ./11-debugging-techniques
      - run: go run ./12-efficient-memory-management-with-pointers-and-slices
      # Go CG with very high frequency (inefficient)
      - run: time GOGC=1    go run ./13-techniques-to-optimize-cpu-bound-and-memory-bound-code
      # Increase threshold to 1000% (help to enhance performance)
      - run: time GOGC=1000 go run ./13-techniques-to-optimize-cpu-bound-and-memory-bound-code
